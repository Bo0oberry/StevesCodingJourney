<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style> 
    @keyframes rotate {
      from {
        transform: rotateY(0deg);
      } to {
        transform: rotateY(360deg);
      }
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box; /* Moved here for global best practice */
    }
    
    body {
      background-color: #111; /* Dark background makes 3D pop better */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    section:has(.box) {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vw;
      position: relative;
      border: 1px solid darkblue;
      
      /* 3D Context Setup */
      perspective: 1000px; 
      transform-style: preserve-3d;
      
      /* Flex/Grid centering ensures the initial origin is dead center */
      display: grid;
      place-items: center;
      
    }
    
    div.boxPrime { 
      position:relative ;
      background-color: grey;
       /*  Animate box */
      animation: rotate 10s linear infinite;
      transform-style: preserve-3d;
      
    }
    
    span svg { 
      position: absolute;
      top: 50%;
      border: 1px solid white
    }
    span.previous svg {
      left: 0;
      transform: rotateZ(270deg);
    }
    span.next svg {
      right: 0;
      transform: rotateZ(90deg)
    }
    .box {
      position: absolute;
      height: 350px;
      width: 200px;
      background-color: grey;
      /* Removed the hardcoded transform from CSS so JS can handle it dynamically */
      transition: transform 0.5s ease; 
    }
  </style>
</head>

<body>
  
  <section>
    <span class="previous"><svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Blade -->
  <polygon points="50,10 60,30 60,80 40,80 40,30" fill="#e0e0e0" stroke="#333" stroke-width="2" />
  
  <!-- Hilt/Guard -->
  <rect x="30" y="80" width="40" height="10" fill="#d4af37" rx="2" />
  
  <!-- Handle -->
  <rect x="45" y="90" width="10" height="10" fill="#4a3728" />
  
  <!-- Power Glow Effect -->
  <line x1="50" y1="20" x2="50" y2="75" stroke="#77d4fc" stroke-width="4" stroke-linecap="round" />
</svg></span>
    <div class="boxPrime">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    </div>
    <span class="next"><svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Blade -->
  <polygon points="50,10 60,30 60,80 40,80 40,30" fill="#e0e0e0" stroke="#333" stroke-width="2" />
  
  <!-- Hilt/Guard -->
  <rect x="30" y="80" width="40" height="10" fill="#d4af37" rx="2" />
  
  <!-- Handle -->
  <rect x="45" y="90" width="10" height="10" fill="#4a3728" />
  
  <!-- Power Glow Effect -->
  <line x1="50" y1="20" x2="50" y2="75" stroke="#77d4fc" stroke-width="4" stroke-linecap="round" />
</svg></span>
  </section>
  
  


<script>
  function randomColor() {
    const hue = Math.floor(Math.random() * 360);
    return `hsl(${hue}, 80%, 50%)`;
  }
  
  const boxList = document.querySelectorAll(".box");
  const angle = 360 / boxList.length;
  
  const boxWidthStr = window.getComputedStyle(document.querySelector(".box")).width;
  const boxWidth = parseFloat(boxWidthStr);
  const radius = Math.round((boxWidth / 2) / Math.tan( (angle / 2) * Math.PI / 180 ) ) ;
  const gap = 30;
  boxList.forEach((ele, index)=>{
    ele.style.backgroundColor = randomColor();
    
    const currentRotation = angle * index;
    ele.style.transform = 
    `rotateY(${currentRotation}deg)
     translateZ(${radius + gap}px)`;
  });
</script> 
</body>

</html>
