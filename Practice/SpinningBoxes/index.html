<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./project_1_css.css">
  <link rel="stylesheet" href="./project_2_css.css">
  <title></title>
  <style> 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: hsla(235, 85%, 15%, 0.9); 
      display: grid;
      place-items: center;
      grid-auto-columns: 100vw;
      grid-auto-rows: 100vw;
      gap: 50px;
      min-height: 100vh;
      padding-bottom: 50px;
     
    }
    
    section {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: hsla(300, 89%, 21%, 0.97);
    }
  </style>
</head>

<body>
  
  <section id="project_1">
    <span class="previous"><svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Blade -->
  <polygon points="50,10 60,30 60,80 40,80 40,30" fill="#e0e0e0" stroke="#333" stroke-width="2" />
  
  <!-- Hilt/Guard -->
  <rect x="30" y="80" width="40" height="10" fill="#d4af37" rx="2" />
  
  <!-- Handle -->
  <rect x="45" y="90" width="10" height="10" fill="#4a3728" />
  
  <!-- Power Glow Effect -->
  <line x1="50" y1="20" x2="50" y2="75" stroke="#77d4fc" stroke-width="4" stroke-linecap="round" />
</svg></span>
    <div class="boxPrime">
    </div>
    <span class="next">
      <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Blade -->
        <polygon points="50,10 60,30 60,80 40,80 40,30" fill="#e0e0e0" stroke="#333" stroke-width="2" />
        
        <!-- Hilt/Guard -->
        <rect x="30" y="80" width="40" height="10" fill="#d4af37" rx="2" />
        
        <!-- Handle -->
        <rect x="45" y="90" width="10" height="10" fill="#4a3728" />
        
        <!-- Power Glow Effect -->
        <line x1="50" y1="20" x2="50" y2="75" stroke="#77d4fc" stroke-width="4" stroke-linecap="round" />
      </svg>
    </span> 
  </section>
  
  <section id="project_2">
    <div id="project_2_boxMain"></div>
  </section>
  
  <section>
    <div class="boxPrime"></div>
  </section>
  
  
  <script src="./project_1_js.js"></script>
  <script src="./project_2_js.js"></script>
</body>

</html>
