<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Metallic Blade Guard Gradient -->
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="50%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>

    <!-- Metal Steel Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#455A64"/>
    </linearGradient>

    <!-- Dark Metal Engine Gradient -->
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>

    <!-- Gold Aquila/Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Chain Tooth Pattern -->
    <pattern id="chainTeeth" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 15 20 L 20 5 L 10 0 Z" fill="url(#metalGrad)" stroke="#263238" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ground Drop Shadow -->
  <!-- <ellipse cx="400" cy="260" rx="360" ry="12" fill="#000000" opacity="0.2"/> -->

  <!-- ================= CHAIN TEETH (BOTTOM TRACK) ================= -->
  <g id="bottom-teeth">
    <!-- Repeating teeth along the bottom cutting edge -->
    <path d="
      M 280 185 L 295 200 L 285 200 Z
      M 310 185 L 325 200 L 315 200 Z
      M 340 185 L 355 200 L 345 200 Z
      M 370 185 L 385 200 L 375 200 Z
      M 400 185 L 415 200 L 405 200 Z
      M 430 185 L 445 200 L 435 200 Z
      M 460 185 L 475 200 L 465 200 Z
      M 490 185 L 505 200 L 495 200 Z
      M 520 185 L 535 200 L 525 200 Z
      M 550 185 L 565 200 L 555 200 Z
      M 580 185 L 595 200 L 585 200 Z
      M 610 185 L 625 200 L 615 200 Z
      M 640 185 L 655 200 L 645 200 Z
      M 670 185 L 685 200 L 675 200 Z
      M 700 185 L 715 195 L 705 195 Z
    " fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>
  </g>

  <!-- Internal Chain Track Bar -->
  <rect x="260" y="110" rx="5" ry="5" width="460" height="75" fill="#1C313A" stroke="#000000" stroke-width="2"/>

  <!-- ================= MAIN CASING (RED BODY) ================= -->
  <!-- Top & Front Enclosure Shell -->
  <path d="M 240 95 L 690 95 L 740 135 L 730 185 L 240 185 Z" fill="url(#casingGrad)" stroke="#1B0000" stroke-width="3"/>
  <!-- Top Ridge Reinforcement -->
  <path d="M 240 95 L 690 95 L 680 105 L 240 105 Z" fill="#E53935"/>
  <path d="M 240 185 L 730 185 L 715 175 L 240 175 Z" fill="#5C0000"/>

  <!-- Casing Screws / Rivets -->
  <g fill="#37474F" stroke="#102027" stroke-width="1">
    <circle cx="270" cy="115" r="3"/>
    <circle cx="350" cy="115" r="3"/>
    <circle cx="430" cy="115" r="3"/>
    <circle cx="510" cy="115" r="3"/>
    <circle cx="590" cy="115" r="3"/>
    <circle cx="670" cy="115" r="3"/>

    <circle cx="270" cy="165" r="3"/>
    <circle cx="350" cy="165" r="3"/>
    <circle cx="430" cy="165" r="3"/>
    <circle cx="510" cy="165" r="3"/>
    <circle cx="590" cy="165" r="3"/>
    <circle cx="670" cy="165" r="3"/>
  </g>

  <!-- ================= ENGINE HOUSING & EXHAUST ================= -->
  <!-- Main Motor Block -->
  <rect x="170" y="80" width="90" height="120" rx="8" fill="url(#engineGrad)" stroke="#102027" stroke-width="3"/>
  <!-- Exhaust Vents -->
  <g fill="#102027">
    <rect x="185" y="95" width="25" height="6" rx="2"/>
    <rect x="185" y="108" width="25" height="6" rx="2"/>
    <rect x="185" y="121" width="25" height="6" rx="2"/>
    <rect x="185" y="134" width="25" height="6" rx="2"/>

    <rect x="220" y="95" width="25" height="6" rx="2"/>
    <rect x="220" y="108" width="25" height="6" rx="2"/>
    <rect x="220" y="121" width="25" height="6" rx="2"/>
    <rect x="220" y="134" width="25" height="6" rx="2"/>
  </g>

  <!-- Imperial Skull Icon on Engine -->
  <g id="skull-icon" transform="translate(202, 155)">
    <!-- Skull Cranium -->
    <path d="M 0 0 C -12 -18, 12 -18, 24 0 C 26 10, 20 18, 18 20 L 6 20 C 4 18, -2 10, 0 0 Z" fill="url(#goldGrad)" stroke="#5D4037" stroke-width="1.5"/>
    <!-- Eye Sockets -->
    <circle cx="6" cy="2" r="3" fill="#1B0000"/>
    <circle cx="18" cy="2" r="3" fill="#1B0000"/>
    <!-- Teeth Slots -->
    <path d="M 8 15 L 8 20 M 12 15 L 12 20 M 16 15 L 16 20" stroke="#1B0000" stroke-width="1.5"/>
  </g>

  <!-- ================= HAND GUARD & AQUILA WINGS ================= -->
  <!-- Gold Crossguard Shell -->
  <path d="M 160 65 L 180 65 L 175 215 L 155 215 Z" fill="url(#goldGrad)" stroke="#5D4037" stroke-width="2"/>
  <!-- Eagle Wing Guard Plate -->
  <path d="M 170 70 Q 120 75 100 120 Q 130 135 170 140 Z" fill="url(#goldGrad)" stroke="#4E342E" stroke-width="2"/>
  <!-- Wing Feather Details -->
  <path d="M 155 82 Q 125 90 112 115 M 160 98 Q 135 105 125 125" fill="none" stroke="#5D4037" stroke-width="2"/>

  <!-- ================= HANDLE & POMMEL ================= -->
  <!-- Grip Shaft -->
  <rect x="70" y="128" width="90" height="24" rx="4" fill="#212121" stroke="#000000" stroke-width="2"/>
  <!-- Leather Grip Wraps -->
  <g stroke="#8D6E63" stroke-width="3">
    <line x1="85" y1="128" x2="78" y2="152"/>
    <line x1="105" y1="128" x2="98" y2="152"/>
    <line x1="125" y1="128" x2="118" y2="152"/>
    <line x1="145" y1="128" x2="138" y2="152"/>
  </g>

  <!-- Pommel Cap -->
  <path d="M 70 120 L 50 125 L 50 155 L 70 160 Z" fill="url(#goldGrad)" stroke="#4E342E" stroke-width="2"/>
  <!-- Skull Pommel Stud -->
  <circle cx="50" cy="140" r="7" fill="url(#metalGrad)" stroke="#263238" stroke-width="1.5"/>
</svg>
