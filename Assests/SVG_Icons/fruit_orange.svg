<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Orange Body Gradient -->
    <radialGradient id="orangeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="40%" stop-color="#FF9800"/>
      <stop offset="85%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <!-- Shadow Gradient Under Leaves -->
    <linearGradient id="leafShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#689F38"/>
      <stop offset="50%" stop-color="#558B2F"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>

    <!-- Right Large Leaf Gradient -->
    <linearGradient id="rightLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="50%" stop-color="#4B830D"/>
      <stop offset="100%" stop-color="#2E5B09"/>
    </linearGradient>

    <!-- Left Leaf Gradient -->
    <linearGradient id="leftLeafGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#689F38"/>
      <stop offset="60%" stop-color="#33691E"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>

  <!-- Drop Shadow on Ground -->
  <!--<ellipse cx="230" cy="355" rx="100" ry="18" fill="#000000" opacity="0.12"/>-->

  <!-- Orange Fruit Body -->
  <path d="M 140 260 C 120 200, 160 145, 220 135 C 280 125, 340 160, 350 220 C 360 280, 310 345, 240 350 C 170 355, 145 310, 140 260 Z" fill="url(#orangeGrad)"/>

  <!-- Dimpled Texture Highlights -->
  <g fill="#FFFFFF" opacity="0.15">
    <circle cx="200" cy="180" r="2"/>
    <circle cx="220" cy="170" r="1.5"/>
    <circle cx="180" cy="210" r="2.5"/>
    <circle cx="210" cy="230" r="2"/>
    <circle cx="250" cy="210" r="1.5"/>
    <circle cx="230" cy="260" r="2"/>
    <circle cx="190" cy="280" r="1.8"/>
  </g>

  <!-- Shadow on Fruit under Right Leaf -->
  <path d="M 215 140 C 260 155, 310 180, 340 215 C 320 180, 270 150, 215 140 Z" fill="url(#leafShadow)"/>

  <!-- Main Stem -->
  <path d="M 222 142 Q 220 100 215 75 Q 212 50 214 30 L 221 30 Q 220 50 223 75 Q 228 100 228 142 Z" fill="url(#stemGrad)"/>

  <!-- Left Leaf Stem Branch -->
  <path d="M 220 90 Q 195 102 180 120 L 184 123 Q 198 106 222 95 Z" fill="url(#stemGrad)"/>

  <!-- Left Leaf -->
  <g>
    <path d="M 182 122 C 140 110, 80 130, 50 230 C 110 200, 150 170, 182 122 Z" fill="url(#leftLeafGrad)"/>
    <!-- Central Vein -->
    <path d="M 182 122 C 145 145, 105 170, 50 230" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Right Leaf -->
  <g>
    <!-- Leaf Body -->
    <path d="M 226 92 C 270 90, 380 95, 450 175 C 380 230, 280 210, 226 92 Z" fill="url(#rightLeafGrad)"/>
    <!-- Central Vein -->
    <path d="M 226 92 C 300 125, 380 150, 450 175" fill="none" stroke="#AED581" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Side Veins -->
    <path d="M 270 112 Q 290 100 310 98 M 310 125 Q 340 110 370 108 M 350 140 Q 380 125 410 125" fill="none" stroke="#AED581" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
