<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Base Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Metallic Bezel Gradient -->
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Recessed Rim Shadow Gradient -->
    <radialGradient id="recessed-grad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Main Red Button Face Gradient -->
    <radialGradient id="button-face" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="60%" stop-color="#E53935"/>
      <stop offset="90%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </radialGradient>

    <!-- Curved Gloss Highlight Gradient -->
    <linearGradient id="gloss-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="100" cy="106" rx="72" ry="72" fill="#000000" opacity="0.25" filter="url(#shadow)"/>

  <!-- Outer Metallic Bezel Ring -->
  <circle cx="100" cy="100" r="76" fill="url(#bezel-grad)"/>

  <!-- Inner Dark Recessed Well -->
  <circle cx="100" cy="100" r="66" fill="url(#recessed-grad)"/>

  <!-- Button 3D Base/Side Thickness -->
  <circle cx="100" cy="101" r="60" fill="#7F0000"/>

  <!-- Main Pushable Button Surface -->
  <circle cx="100" cy="97" r="60" fill="url(#button-face)"/>

  <!-- Curved Gloss Reflection Overlay -->
  <path d="M 47 88 C 55 58, 145 58, 153 88 C 130 72, 70 72, 47 88 Z" fill="url(#gloss-grad)"/>

  <!-- Illuminated Power Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <!-- Power Circle Arc -->
    <path d="M 86 86 A 24 24 0 1 0 114 86"/>
    <!-- Power Top Vertical Bar -->
    <line x1="100" y1="73" x2="100" y2="93"/>
  </g>
</svg>
